name: Deploy to GitHub Pages

# Builds the site and publishes dist/ to the `gh-pages` branch.
# Repository settings → Pages → "Deploy from a branch" → gh-pages / (root).
# Served at https://manamcoffee.com (www redirects).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Checkout keys. Add them under Settings → Secrets and variables → Actions.
          # Missing ones are fine: checkout then says payment is not live yet.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_RAZORPAY_KEY_ID: ${{ secrets.VITE_RAZORPAY_KEY_ID }}
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
          # Custom domain (DNS at Hostinger). Written as CNAME on every deploy.
          cname: manamcoffee.com
